name: Deploy Chapters to Telegraph
on:
  workflow_dispatch: # يتيح لك تشغيل السكربت يدوياً بضغطة زر من تبويب Actions في GitHub

jobs:
  publish_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # إصدار بايثون مستقر ومتوافق مع المكتبات

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin requests

      - name: Run Telegraph Publisher Script
        env:
          # تمرير المفاتيح السرية المشفرة من GitHub Secrets إلى متغيرات البيئة
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          TELEGRAPH_ACCESS_TOKEN: ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
        run: python publish_to_telegraph.py
        
