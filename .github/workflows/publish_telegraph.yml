name: Deploy Chapters to Telegraph
on:
  workflow_dispatch: # يتيح لك تشغيل السكربت يدوياً بضغطة زر من تبويب Actions في GitHub

jobs:
  publish_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin requests telegraph # تم إضافة مكتبة telegraph هنا لضمان عمل السكريبت

      - name: Run Telegraph Publisher Script
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          TELEGRAPH_ACCESS_TOKEN: ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # خطوة إضافية: تمرير توكن البوت
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }} # خطوة إضافية: تمرير معرف القناة
        run: python publish_to_telegraph.py
        
