name: Generate Novel Images
on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # تم التحديث من v3 إلى v4

      - name: Set up Python
        uses: actions/setup-python@v5 # تم التحديث من v4 إلى v5
        with:
          python-version: '3.11' 

      - name: Install Requirements
        run: pip install requests firebase-admin 

      - name: Run Script
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: python generate__images.py
