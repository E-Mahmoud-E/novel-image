name: Generate Novel Images
on:
  workflow_dispatch: # هذا يسمح لك بتشغيل الكود يدوياً بضغطة زر

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3 # يسحب ملفاتك من جيت هاب لكي يعمل عليها

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Requirements
        run: pip install requests firebase-admin # تثبيت المكتبات اللازمة

      - name: Run Script
        env:
          # تأكد أن هذه الأسماء مطابقة تماماً لما وضعته في الـ Secrets
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        # 👇 إذا سميت ملف الكود اسماً مختلفاً، غيره هنا
        run: python .github/workflows/generate__images.py
